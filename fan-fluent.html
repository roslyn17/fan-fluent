<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fan Fluent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --turf:#0f3d24; --turf-deep:#0a2a19; --line:rgba(255,255,255,.14);
  --panel:rgba(8,14,12,.82); --panel-2:rgba(255,255,255,.06); --ink:#f4f6f2; --muted:#a9b8ae;
  --led:#ffcf3f; --accent:#ffcf3f; --accent-ink:#1a1400;
  --good:#3fe07f; --good-bg:rgba(63,224,127,.14); --bad:#ff6b57; --bad-bg:rgba(255,107,87,.14);
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--turf-deep)}
body{
  margin:0;color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:
    radial-gradient(ellipse 70% 38% at 18% -6%, rgba(255,250,220,.30), transparent 70%),
    radial-gradient(ellipse 70% 38% at 82% -6%, rgba(255,250,220,.30), transparent 70%),
    repeating-linear-gradient(180deg, transparent 0 79px, var(--line) 79px 81px),
    repeating-linear-gradient(180deg, rgba(255,255,255,.025) 0 160px, transparent 160px 320px),
    linear-gradient(180deg, #145232, var(--turf) 40%, var(--turf-deep));
  background-attachment:fixed;
}
.wrap{max-width:720px;margin:0 auto;padding:28px 16px 48px;position:relative}
header{text-align:center;margin-bottom:22px}
h1{font-family:var(--display);font-weight:400;font-size:56px;line-height:.9;margin:0;letter-spacing:.02em;text-shadow:0 3px 0 rgba(0,0,0,.35)}
h1 span{color:var(--led);display:block}
.sub{color:var(--muted);font-size:14px}
header .sub{margin-top:8px;letter-spacing:.18em;text-transform:uppercase;font-size:12px;font-weight:600}
.card{position:relative;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:22px;box-shadow:0 10px 40px rgba(0,0,0,.45);backdrop-filter:blur(6px);overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--stripe,linear-gradient(90deg,var(--led),#fff6c8,var(--led)));transition:background .3s}
.section-label{font-family:var(--display);font-size:22px;letter-spacing:.06em;color:#fff;margin:26px 0 10px;display:flex;align-items:center;gap:10px}
.section-label::after{content:"";flex:1;height:2px;background:var(--line)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.mode{all:unset;cursor:pointer;position:relative;background:var(--panel);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 16px 14px 16px;transition:transform .12s,border-color .12s,box-shadow .12s;overflow:hidden}
.mode:hover,.mode:focus-visible{border-color:var(--led);transform:translateY(-3px) rotate(-.4deg);box-shadow:0 8px 24px rgba(255,207,63,.18)}
.mode .num{position:absolute;right:10px;top:-6px;font-family:var(--display);font-size:64px;line-height:1;color:rgba(255,255,255,.07)}
.mode b{display:block;font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.03em;margin-bottom:2px;position:relative}
.mode small{color:var(--muted);font-size:13px;position:relative}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:rgba(255,207,63,.14);color:var(--led);margin-top:10px;letter-spacing:.04em}
select{font:inherit;font-weight:600;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:var(--panel);color:var(--ink);width:100%;max-width:320px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
/* scoreboard */
.scoreboard{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#050807;border:2px solid #222;border-radius:12px;padding:8px;margin-bottom:12px;box-shadow:inset 0 0 18px rgba(0,0,0,.8),0 6px 20px rgba(0,0,0,.4)}
.sb{text-align:center}
.sb small{display:block;font-size:10px;letter-spacing:.2em;color:#8a8f8c;font-weight:700}
.sb b{display:block;font-family:var(--display);font-weight:400;font-size:34px;line-height:1;color:var(--led);text-shadow:0 0 8px rgba(255,207,63,.65)}
.sb b.hot{color:#ff8a3d;text-shadow:0 0 10px rgba(255,120,40,.8)}
#quiz-title{font-family:var(--display);font-size:20px;letter-spacing:.05em;color:#fff;text-align:center;margin-bottom:8px}
/* field progress */
.field{position:relative;height:34px;border-radius:8px;margin:0 0 16px;overflow:visible;
  background:repeating-linear-gradient(90deg, transparent 0 calc(10% - 1px), rgba(255,255,255,.45) calc(10% - 1px) 10%), linear-gradient(90deg,#9b2335 0 6%,#1d6b3c 6% 94%,#9b2335 94%);
  border:2px solid rgba(255,255,255,.6)}
.field .ball{position:absolute;top:50%;left:6%;transform:translate(-50%,-50%) rotate(-25deg);font-size:24px;transition:left .45s cubic-bezier(.3,1.4,.5,1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.prompt-label{color:var(--led);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:6px 0 6px}
.prompt{font-family:var(--display);font-weight:400;font-size:52px;line-height:1;letter-spacing:.02em;margin:0 0 6px}
.hint{color:var(--muted);font-size:13px;margin-bottom:10px}
.options{display:grid;gap:10px;margin-top:16px}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:var(--panel-2);font-weight:600;transition:transform .1s,border-color .1s,background .1s}
.opt:hover:not([disabled]),.opt:focus-visible{border-color:var(--led);background:rgba(255,207,63,.08);transform:translateX(3px)}
.opt .k{font-family:var(--display);font-size:18px;color:var(--accent-ink);background:var(--led);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;flex:none}
.opt.correct{background:var(--good-bg);border-color:var(--good);animation:bounce .45s}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px}
.sw i{display:block;width:44px;height:30px;border-radius:6px;border:1px solid rgba(255,255,255,.35)}
.sw span{font-size:11px;color:var(--muted);white-space:nowrap}
.big .sw i{width:76px;height:56px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.big .sw span{font-size:12px}
input[type=text]{font:inherit;font-size:20px;font-weight:600;width:100%;padding:14px 16px;border-radius:12px;border:2px solid rgba(255,255,255,.2);background:rgba(0,0,0,.35);color:var(--ink);margin-top:14px}
input[type=text]:focus{outline:none;border-color:var(--led);box-shadow:0 0 0 4px rgba(255,207,63,.2)}
.btn{all:unset;cursor:pointer;background:var(--led);color:var(--accent-ink);padding:11px 20px;border-radius:12px;font-family:var(--display);font-size:22px;letter-spacing:.05em;text-align:center;box-shadow:0 4px 0 #b88e10;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b88e10}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.25);box-shadow:none}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
.feedback{margin-top:14px;padding:12px 14px;border-radius:12px;font-weight:600;display:none}
.feedback.good{display:block;background:var(--good-bg);color:var(--good)}
.feedback.bad{display:block;background:var(--bad-bg);color:var(--bad)}
.actions{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
/* big pop text */
.pop{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);font-family:var(--display);font-size:64px;white-space:nowrap;pointer-events:none;opacity:0;z-index:5;text-shadow:0 4px 0 rgba(0,0,0,.5)}
.pop.go{animation:pop 1s ease-out forwards}
.pop.good{color:var(--led)} .pop.bad{color:var(--bad);font-size:52px}
.shake{animation:shake .4s}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-6deg)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-3deg)}60%{opacity:1;transform:translate(-50%,-55%) scale(1) rotate(-3deg)}100%{opacity:0;transform:translate(-50%,-75%) scale(1) rotate(-3deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
/* results */
.final{background:#050807;border:2px solid #222;border-radius:14px;padding:18px;text-align:center;box-shadow:inset 0 0 24px rgba(0,0,0,.9)}
.final small{display:block;font-size:12px;letter-spacing:.3em;color:#8a8f8c;font-weight:700}
.score{font-family:var(--display);font-size:96px;line-height:1;color:var(--led);text-shadow:0 0 14px rgba(255,207,63,.7);margin:4px 0}
.grade{display:inline-block;font-family:var(--display);font-size:26px;letter-spacing:.05em;padding:4px 14px;border-radius:99px;background:rgba(255,207,63,.15);color:var(--led);margin-bottom:6px}
#res-title{font-family:var(--display);font-size:20px;letter-spacing:.05em;color:#fff;text-align:center;margin-bottom:10px}
#res-msg{text-align:center;margin-top:12px}
.missed{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:8px}
.missed li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:10px;flex-wrap:wrap;background:var(--panel-2)}
.hidden{display:none!important}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:480px){h1{font-size:46px}.prompt{font-size:40px}.big .sw i{width:58px;height:44px}.score{font-size:76px}.pop,.pop.bad{font-size:44px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Fan <span>Fluent</span></h1>
    <div class="sub">🏈 Football · Learn all 32 teams 🏈</div>
  </header>

  <!-- HOME -->
  <section id="home">
    <div class="section-label">Teams to practice</div>
    <select id="pool"></select>

    <div class="section-label">Names &amp; cities</div>
    <div class="modes" id="modes-nc"></div>

    <div class="section-label">Colors</div>
    <div class="modes" id="modes-c"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div id="quiz-title"></div>
    <div class="scoreboard">
      <div class="sb"><small>SCORE</small><b id="sb-score">0</b></div>
      <div class="sb"><small>PLAY</small><b id="quiz-count">1/10</b></div>
      <div class="sb"><small>STREAK</small><b id="sb-streak">0</b></div>
    </div>
    <div class="field" aria-hidden="true"><span class="ball" id="ball">🏈</span></div>
    <div class="card" id="qcard">
      <div class="pop" id="pop"></div>
      <div class="prompt-label" id="prompt-label"></div>
      <div id="prompt"></div>
      <div class="hint" id="hint"></div>
      <div id="answer-area"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn ghost" id="quit">Quit</button>
        <button class="btn ghost hidden" id="idk">IDK</button>
        <button class="btn hidden" id="submit">Check</button>
        <button class="btn hidden" id="next">Next →</button>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card">
      <div id="res-title"></div>
      <div class="final">
        <small>FINAL</small>
        <div class="score" id="res-score"></div>
        <div class="grade" id="res-grade"></div>
      </div>
      <div id="res-msg" class="sub"></div>
      <ul class="missed" id="res-missed"></ul>
      <div class="actions">
        <button class="btn ghost" id="home-btn">All modes</button>
        <button class="btn ghost hidden" id="retry-missed">Practice missed</button>
        <button class="btn" id="again">Play again</button>
      </div>
    </div>
  </section>

  <footer>Team names, locations and conferences per NFL.com. Colors per TeamColorCodes.com (primary colors only). Not affiliated with or endorsed by the NFL or any of its teams.</footer>
</div>
<canvas id="confetti"></canvas>

<script>
const C = (name, hex) => ({name, hex});
const TEAMS = [
  // AFC East
  {name:"Bills", loc:"Buffalo", div:"AFC East", colors:[C("blue","#00338D"),C("red","#C60C30")]},
  {name:"Dolphins", loc:"Miami", div:"AFC East", colors:[C("aqua","#008E97"),C("orange","#FC4C02")], nick:["fins"]},
  {name:"Patriots", loc:"New England", div:"AFC East", colors:[C("navy","#002244"),C("red","#C60C30"),C("silver","#B0B7BC")], nick:["pats"]},
  {name:"Jets", loc:"New York", div:"AFC East", colors:[C("green","#125740"),C("white","#FFFFFF")]},
  // AFC North
  {name:"Ravens", loc:"Baltimore", div:"AFC North", colors:[C("purple","#241773"),C("black","#000000"),C("gold","#9E7C0C")]},
  {name:"Bengals", loc:"Cincinnati", div:"AFC North", colors:[C("orange","#FB4F14"),C("black","#000000")]},
  {name:"Browns", loc:"Cleveland", div:"AFC North", colors:[C("brown","#311D00"),C("orange","#FF3C00")]},
  {name:"Steelers", loc:"Pittsburgh", div:"AFC North", colors:[C("gold","#FFB612"),C("black","#101820")]},
  // AFC South
  {name:"Texans", loc:"Houston", div:"AFC South", colors:[C("navy","#03202F"),C("red","#A71930")]},
  {name:"Colts", loc:"Indianapolis", div:"AFC South", colors:[C("blue","#002C5F"),C("white","#FFFFFF")]},
  {name:"Jaguars", loc:"Jacksonville", div:"AFC South", colors:[C("teal","#006778"),C("black","#101820"),C("gold","#D7A22A")], nick:["jags"]},
  {name:"Titans", loc:"Tennessee", div:"AFC South", colors:[C("navy","#0C2340"),C("light blue","#4B92DB"),C("red","#C8102E")]},
  // AFC West
  {name:"Broncos", loc:"Denver", div:"AFC West", colors:[C("orange","#FB4F14"),C("navy","#002244")]},
  {name:"Chiefs", loc:"Kansas City", div:"AFC West", colors:[C("red","#E31837"),C("gold","#FFB81C")]},
  {name:"Raiders", loc:"Las Vegas", div:"AFC West", colors:[C("silver","#A5ACAF"),C("black","#000000")]},
  {name:"Chargers", loc:"Los Angeles", div:"AFC West", colors:[C("powder blue","#0080C6"),C("gold","#FFC20E")], nick:["bolts"]},
  // NFC East
  {name:"Cowboys", loc:"Dallas", div:"NFC East", colors:[C("blue","#003594"),C("silver","#869397")]},
  {name:"Giants", loc:"New York", div:"NFC East", colors:[C("blue","#0B2265"),C("red","#A71930")]},
  {name:"Eagles", loc:"Philadelphia", div:"NFC East", colors:[C("midnight green","#004C54"),C("silver","#A5ACAF")]},
  {name:"Commanders", loc:"Washington", div:"NFC East", colors:[C("burgundy","#5A1414"),C("gold","#FFB612")]},
  // NFC North
  {name:"Bears", loc:"Chicago", div:"NFC North", colors:[C("navy","#0B162A"),C("orange","#C83803")]},
  {name:"Lions", loc:"Detroit", div:"NFC North", colors:[C("Honolulu blue","#0076B6"),C("silver","#B0B7BC")]},
  {name:"Packers", loc:"Green Bay", div:"NFC North", colors:[C("green","#203731"),C("gold","#FFB612")], nick:["pack"]},
  {name:"Vikings", loc:"Minnesota", div:"NFC North", colors:[C("purple","#4F2683"),C("gold","#FFC62F")], nick:["vikes"]},
  // NFC South
  {name:"Falcons", loc:"Atlanta", div:"NFC South", colors:[C("red","#A71930"),C("black","#000000")]},
  {name:"Panthers", loc:"Carolina", div:"NFC South", colors:[C("blue","#0085CA"),C("black","#101820")]},
  {name:"Saints", loc:"New Orleans", div:"NFC South", colors:[C("gold","#D3BC8D"),C("black","#101820")]},
  {name:"Buccaneers", loc:"Tampa Bay", div:"NFC South", colors:[C("red","#D50A0A"),C("pewter","#34302B")], nick:["bucs"]},
  // NFC West
  {name:"Cardinals", loc:"Arizona", div:"NFC West", colors:[C("red","#97233F"),C("black","#000000")]},
  {name:"Rams", loc:"Los Angeles", div:"NFC West", colors:[C("blue","#003594"),C("yellow","#FFD100")]},
  {name:"49ers", loc:"San Francisco", div:"NFC West", colors:[C("red","#AA0000"),C("gold","#B3995D")], nick:["niners","fortyniners"]},
  {name:"Seahawks", loc:"Seattle", div:"NFC West", colors:[C("navy","#002244"),C("green","#69BE28"),C("gray","#A5ACAF")], nick:["hawks"]},
];
// Official short forms only (periods ignored, so "L.A." also works)
const LOC_ALIASES = {
  "Los Angeles":["LA"], "New York":["NY","NYC"], "Kansas City":["KC"], "San Francisco":["SF"],
  "Washington":["Washington DC","DC"]
};
const exact = s => s.toLowerCase().replace(/[.,]/g,"").replace(/\s+/g," ").trim();

const MODES = [
  {id:"c2n-mc", group:"nc", title:"City → Team", desc:"See the city, pick the team name", fmt:"Choose", ask:"city", ans:"name", type:"mc"},
  {id:"n2c-mc", group:"nc", title:"Team → City", desc:"See the team name, pick the city", fmt:"Choose", ask:"name", ans:"loc", type:"mc"},
  {id:"c2n-tx", group:"nc", title:"City → Team", desc:"See the city, type the team name", fmt:"Type", ask:"city", ans:"name", type:"text"},
  {id:"n2c-tx", group:"nc", title:"Team → City", desc:"See the team name, type the city", fmt:"Type", ask:"name", ans:"loc", type:"text"},
  {id:"t2col", group:"c", title:"Team → Colors", desc:"See the team, pick its colors", fmt:"Choose", ask:"team", ans:"colors", type:"mc"},
  {id:"col2t", group:"c", title:"Colors → Team", desc:"See the colors, pick the team", fmt:"Choose", ask:"colors", ans:"team", type:"mc"},
];

// ---------- storage (per-viewer, optional) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let misses = store.get("gf-misses", {}); // {modeId: {teamName: count}}

// ---------- helpers ----------
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const full = t => `${t.loc} ${t.name}`;
const norm = s => s.toLowerCase().replace(/&/g,"and").replace(/[^a-z0-9]/g,"");
const colorKey = t => t.colors.map(c=>c.name).sort().join("|");
function lev(a,b){ const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let p=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const c=[i]; for(let j=1;j<=n;j++) c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=c; }
  return p[n]; }
const close = (guess, target) => { const tol = target.length <= 5 ? 1 : 2; return guess === target || (guess.length >= 3 && lev(guess, target) <= tol); };
function swatchHTML(t, big){
  return `<div class="swatches${big?' big':''}">` + t.colors.map(c=>`<div class="sw"><i style="background:${c.hex}"></i><span>${c.name}</span></div>`).join("") + `</div>`;
}

// ---------- home ----------
const pools = [["all",`All teams (${TEAMS.length} teams)`]];
["AFC","NFC"].forEach(c=>pools.push([c,`${c} (${TEAMS.filter(t=>t.div.startsWith(c)).length} teams)`]));
$("pool").innerHTML = pools.map(([v,l])=>`<option value="${v}">${l}</option>`).join("");
const savedPool = store.get("gf-pool","all");
$("pool").value = pools.some(([v])=>v===savedPool) ? savedPool : "all";
$("pool").onchange = e => store.set("gf-pool", e.target.value);

function renderModes(){
  for(const g of ["nc","c"]){
    $("modes-"+g).innerHTML = MODES.filter(m=>m.group===g).map(m=>
      `<button class="mode" data-id="${m.id}"><span class="num">${String(MODES.indexOf(m)+1).padStart(2,"0")}</span><b>${m.title}</b><small>${m.desc}</small><br><span class="tag">${m.fmt==="Type"?"⌨️ Type it":"☝️ Multiple choice"}</span></button>`).join("");
  }
  document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>start(MODES.find(m=>m.id===b.dataset.id)));
}
renderModes();

function poolTeams(){
  const v = $("pool").value;
  if(v==="all") return TEAMS;
  return TEAMS.filter(t=>t.div.startsWith(v));
}

// ---------- quiz state ----------
let S = null;
const ROUND = 10;

function pickRound(pool, mode, forced){
  if(forced) return forced.slice(); // replay missed teams in the order they were missed
  const mm = misses[mode.id] || {};
  // weighted sample without replacement: missed teams more likely
  let bag = pool.map(t=>({t, w:1 + 2*(mm[t.name]||0)}));
  const out = [];
  const n = Math.min(ROUND, pool.length);
  while(out.length < n){
    const total = bag.reduce((s,x)=>s+x.w,0);
    let r = Math.random()*total, i=0;
    while(r > bag[i].w){ r -= bag[i].w; i++; }
    out.push(bag[i].t); bag.splice(i,1);
  }
  return out;
}

function start(mode, forced, replay){
  const pool = poolTeams();
  S = {mode, pool, queue: pickRound(pool, mode, forced), i:0, score:0, streak:0, best:0, missed:[], missedOpts:{}, replay: replay||null, answered:false};
  $("sb-score").textContent = "0"; $("sb-streak").textContent = "0"; $("sb-streak").classList.remove("hot");
  $("home").classList.add("hidden"); $("results").classList.add("hidden"); $("quiz").classList.remove("hidden");
  $("quiz-title").textContent = forced
    ? `Practice · ${forced.length} missed ${forced.length===1?"team":"teams"}`
    : `${mode.title} · ${mode.fmt==="Type"?"Type it":"Multiple choice"}`;
  show();
}

function distractors(t, n, sameKeyFn){
  // prefer same-division teams for name/city modes, then others; never ambiguous ones
  const others = TEAMS.filter(o => o !== t && !sameKeyFn(o));
  const sameDiv = shuffle(others.filter(o=>o.div===t.div));
  const rest = shuffle(others.filter(o=>o.div!==t.div));
  const picked = [];
  for(const o of [...sameDiv, ...rest]){ if(picked.length>=n) break; if(!picked.some(p=>sameKeyFn.call(null,o,p))) picked.push(o); }
  return picked;
}

function show(){
  const {mode, queue, i} = S; const t = queue[i];
  S.answered = false; S.current = t;
  $("quiz-count").textContent = `${i+1}/${queue.length}`;
  moveBall(i/queue.length);
  $("qcard").style.removeProperty("--stripe");
  $("feedback").className = "feedback"; $("feedback").textContent = "";
  $("next").classList.add("hidden");
  $("hint").textContent = "";

  // prompt
  if(mode.ask==="city"){
    $("prompt-label").textContent = "Complete the team name";
    $("prompt").innerHTML = `<div class="prompt">${t.loc} ____</div>`;  } else if(mode.ask==="name"){
    $("prompt-label").textContent = "Complete the team name";
    $("prompt").innerHTML = `<div class="prompt">____ ${t.name}</div>`;
  } else if(mode.ask==="team"){
    $("prompt-label").textContent = "What are their colors?";
    $("prompt").innerHTML = `<div class="prompt">${full(t)}</div>`;
  } else {
    $("prompt-label").textContent = "Which team wears these colors?";
    $("prompt").innerHTML = swatchHTML(t, true);
  }

  const area = $("answer-area");
  if(mode.type==="mc"){
    $("submit").classList.add("hidden"); $("idk").classList.add("hidden");
    let ds;
    if(mode.ans==="name") ds = distractors(t, 3, (o,p)=> p ? o.name===p.name : o.loc===t.loc);
    else if(mode.ans==="loc") ds = distractors(t, 3, (o,p)=> p ? o.loc===p.loc : o.loc===t.loc);
    else ds = distractors(t, 3, (o,p)=> p ? colorKey(o)===colorKey(p) : colorKey(o)===colorKey(t));
    const opts = (S.replay && S.replay[t.name]) || shuffle([t, ...ds]); // same choices as the missed question
    S.opts = opts;
    area.innerHTML = `<div class="options">` + opts.map((o,k)=>{
      let label;
      if(mode.ans==="name") label = o.name;
      else if(mode.ans==="loc") label = o.loc;
      else if(mode.ans==="colors") label = swatchHTML(o);
      else label = full(o);
      return `<button class="opt" data-k="${k}"><span class="k">${k+1}</span>${label}</button>`;
    }).join("") + `</div>`;
    area.querySelectorAll(".opt").forEach(b=>b.onclick=()=>chooseMC(+b.dataset.k));
  } else {
    $("submit").classList.remove("hidden"); $("idk").classList.remove("hidden");
    area.innerHTML = `<input type="text" id="typed" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="${mode.ans==="name"?"Team name, e.g. Packers":"Location, e.g. Green Bay"}">`;
    setTimeout(()=>$("typed").focus(), 0);
  }
}

function isCorrectMC(o){
  const t = S.current, m = S.mode;
  if(m.ans==="name") return o.loc===t.loc; // either team at a shared city
  if(m.ans==="loc") return o.loc===t.loc;
  if(m.ans==="colors") return o===t;
  return o===t;
}

function chooseMC(k){
  if(S.answered) return;
  const o = S.opts[k]; const ok = isCorrectMC(o);
  document.querySelectorAll(".opt").forEach((b,j)=>{
    b.disabled = true;
    if(isCorrectMC(S.opts[j])) b.classList.add("correct");
    else if(j===k) b.classList.add("wrong");
  });
  finish(ok);
}

function checkTyped(){
  if(S.answered) return;
  const raw = $("typed").value.trim(); if(!raw) return;
  const g = norm(raw); const t = S.current; let ok=false;
  if(S.mode.ans==="name"){
    for(const c of TEAMS.filter(o=>o.loc===t.loc)){
      // exact spelling required (capitalization and spacing ignored); "Packers" or "Green Bay Packers"
      if([c.name, full(c)].map(exact).includes(exact(raw))) ok = true;
    }
  } else {
    // exact spelling required (capitalization ignored); official short forms allowed
    ok = [t.loc, ...(LOC_ALIASES[t.loc]||[])].map(exact).includes(exact(raw));
  }
  $("typed").disabled = true;
  finish(ok);
}

function answerText(t){
  const m = S.mode;
  if(m.ans==="name"){
    const all = TEAMS.filter(o=>o.loc===t.loc);
    return all.length>1 ? all.map(full).join(" or ") : full(t);
  }
  if(m.ans==="loc") return `${t.loc} (${full(t)})`;
  if(m.ans==="colors") return `${full(t)}: ${t.colors.map(c=>c.name).join(", ")}`;
  return full(t);
}

function finish(ok, idk){
  S.answered = true;
  const t = S.current, id = S.mode.id;
  misses[id] = misses[id] || {};
  // flash the team's colors across the top of the card
  const hexes = t.colors.map(c=>c.hex);
  $("qcard").style.setProperty("--stripe", `linear-gradient(90deg, ${hexes.map((h,k)=>`${h} ${k/hexes.length*100}% ${(k+1)/hexes.length*100}%`).join(",")})`);
  if(ok){
    S.score++; S.streak++; S.best = Math.max(S.best, S.streak);
    if(misses[id][t.name]) misses[id][t.name] = Math.max(0, misses[id][t.name]-1);
    $("feedback").className = "feedback good";
    $("feedback").textContent = (S.streak>=3 ? `🔥 ${S.streak} in a row! ` : "Correct! ") + answerText(t);
    popText(S.streak>=3 ? "ON FIRE!" : ["TOUCHDOWN!","FIRST DOWN!","NICE CATCH!","+1"][Math.floor(Math.random()*4)], true);
    confetti(hexes, 70);
  } else {
    S.streak = 0;
    S.missed.push(t);
    if(S.opts && S.mode.type==="mc") S.missedOpts[t.name] = S.opts;
    misses[id][t.name] = (misses[id][t.name]||0) + 1;
    $("feedback").className = "feedback bad";
    if(idk){
      $("feedback").textContent = "No worries. Answer: " + answerText(t) + ". It'll come back in practice.";
    } else {
      $("feedback").textContent = "🚩 Not quite. Answer: " + answerText(t);
      popText(["🚩 FLAG!","INCOMPLETE","FUMBLE!"][Math.floor(Math.random()*3)], false);
      $("qcard").classList.remove("shake"); void $("qcard").offsetWidth; $("qcard").classList.add("shake");
    }
  }
  $("sb-score").textContent = S.score;
  $("sb-streak").textContent = S.streak;
  $("sb-streak").classList.toggle("hot", S.streak>=3);
  moveBall((S.i+1)/S.queue.length);
  store.set("gf-misses", misses);
  $("submit").classList.add("hidden");
  $("idk").classList.add("hidden");
  $("next").classList.remove("hidden");
  $("next").focus();
}

function next(){
  S.i++;
  if(S.i >= S.queue.length) return results();
  show();
}

function results(){
  $("quiz").classList.add("hidden"); $("results").classList.remove("hidden");
  const {score, queue, missed, mode} = S;
  $("res-title").textContent = `${mode.title} · ${mode.fmt==="Type"?"Type it":"Multiple choice"}`;
  $("res-score").textContent = `${score}–${queue.length}`;
  const pct = score/queue.length;
  $("res-grade").textContent = pct===1 ? "🏆 Hall of Fame" : pct>=.8 ? "⭐ All-Pro" : pct>=.6 ? "Starter" : pct>=.4 ? "Rookie" : "Practice Squad";
  $("res-msg").textContent = (pct===1 ? "Perfect round!" : pct>=.7 ? "Nice work. Review the ones you missed below." : "Keep going. Missed teams will come up more often.") + (S.best>=3 ? ` Best streak: 🔥 ${S.best}` : "");
  if(pct===1){ const all = TEAMS.flatMap(t=>t.colors.map(c=>c.hex)); confetti(all, 220); setTimeout(()=>confetti(all,160), 500); }
  else if(pct>=.8) confetti(["#ffcf3f","#ffffff","#3fe07f"], 90);
  $("res-missed").innerHTML = missed.map(t=>`<li><span><b>${full(t)}</b> · ${t.div}</span>${mode.group==="c"?swatchHTML(t):`<span class="sub">${t.loc}</span>`}</li>`).join("");
  $("retry-missed").classList.toggle("hidden", !missed.length);
  $("retry-missed").textContent = `Practice missed (${missed.length})`;
  $("retry-missed").classList.toggle("ghost", !missed.length);
  $("again").classList.toggle("ghost", !!missed.length);
}

// ---------- fun stuff ----------
function moveBall(frac){ $("ball").style.left = `${6 + frac*88}%`; }
function popText(text, good){
  const p = $("pop"); p.className = "pop"; p.textContent = text; void p.offsetWidth;
  p.className = `pop go ${good?"good":"bad"}`;
}
const reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = $("confetti"), cx = cv.getContext("2d"); let parts = [], raf = null;
function sizeCanvas(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
addEventListener("resize", sizeCanvas); sizeCanvas();
function confetti(colors, n){
  if(reduceMotion) return;
  const r = $("qcard").getBoundingClientRect();
  const ox = r.width ? r.left + r.width/2 : innerWidth/2, oy = r.width ? r.top + 40 : innerHeight/3;
  for(let k=0;k<n;k++){
    const a = Math.random()*Math.PI*2, v = 4 + Math.random()*8;
    parts.push({x:ox, y:oy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 6, w:6+Math.random()*6, h:8+Math.random()*8,
      rot:Math.random()*6, vr:(Math.random()-.5)*.4, c:colors[k%colors.length], life:90+Math.random()*50});
  }
  if(!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  parts = parts.filter(p=>p.life-- > 0 && p.y < innerHeight+40);
  for(const p of parts){
    p.vy += .32; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot); cx.globalAlpha = Math.min(1, p.life/30);
    cx.fillStyle = p.c; cx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.strokeStyle = "rgba(255,255,255,.35)"; cx.lineWidth = .6; cx.strokeRect(-p.w/2,-p.h/2,p.w,p.h);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0,0,innerWidth,innerHeight), null);
}

$("submit").onclick = checkTyped;
$("idk").onclick = ()=>{ if(S.answered) return; $("typed").disabled = true; finish(false, true); };
$("next").onclick = next;
$("quit").onclick = goHome;
$("home-btn").onclick = goHome;
$("again").onclick = ()=>start(S.mode);
$("retry-missed").onclick = ()=>start(S.mode, S.missed, S.missedOpts);
function goHome(){ $("quiz").classList.add("hidden"); $("results").classList.add("hidden"); $("home").classList.remove("hidden"); }

document.addEventListener("keydown", e=>{
  if($("quiz").classList.contains("hidden")) return;
  if(e.key==="Enter"){
    e.preventDefault();
    if(S.answered) next(); else if(S.mode.type==="text") checkTyped();
  } else if(S.mode.type==="mc" && !S.answered && /^[1-4]$/.test(e.key)){
    chooseMC(+e.key-1);
  }
});
</script>
