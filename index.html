<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fan Fluent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Fan <span>Fluent</span></h1>
    <div class="sub" id="league-sub">🏈 Football · Learn all 32 teams 🏈</div>
  </header>

  <!-- HOME -->
  <section id="home">
    <div id="league-picker">
      <div class="section-label">League</div>
      <div class="leagues" id="leagues"></div>
    </div>

    <div class="section-label">Teams to practice</div>
    <select id="pool"></select>

    <div class="section-label">Names &amp; cities</div>
    <div class="modes" id="modes-nc"></div>

    <div class="section-label">Colors</div>
    <div class="modes" id="modes-c"></div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div id="quiz-title"></div>
    <div class="scoreboard">
      <div class="sb"><small>SCORE</small><b id="sb-score">0</b></div>
      <div class="sb"><small>PLAY</small><b id="quiz-count">1/10</b></div>
      <div class="sb"><small>STREAK</small><b id="sb-streak">0</b></div>
    </div>
    <div class="field" aria-hidden="true"><span class="ball" id="ball">🏈</span></div>
    <div class="card" id="qcard">
      <div class="pop" id="pop"></div>
      <div class="prompt-label" id="prompt-label"></div>
      <div id="prompt"></div>
      <div class="hint" id="hint"></div>
      <div id="answer-area"></div>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn ghost" id="quit">Quit</button>
        <button class="btn ghost hidden" id="idk">IDK</button>
        <button class="btn hidden" id="submit">Check</button>
        <button class="btn hidden" id="next">Next →</button>
      </div>
    </div>
  </section>

  <!-- RESULTS -->
  <section id="results" class="hidden">
    <div class="card">
      <div id="res-title"></div>
      <div class="final">
        <small>FINAL</small>
        <div class="score" id="res-score"></div>
        <div class="grade" id="res-grade"></div>
      </div>
      <div id="res-msg" class="sub"></div>
      <ul class="missed" id="res-missed"></ul>
      <div class="actions">
        <button class="btn ghost" id="home-btn">All modes</button>
        <button class="btn ghost hidden" id="retry-missed">Practice missed</button>
        <button class="btn" id="again">Play again</button>
      </div>
    </div>
  </section>

  <footer id="credits">Team names, locations and conferences per NFL.com. Colors per TeamColorCodes.com (primary colors only). Not affiliated with or endorsed by the NFL or any of its teams.</footer>
</div>
<canvas id="confetti"></canvas>

<script src="js/leagues/mlb.js?v=3"></script>
<script src="js/leagues/nba.js?v=3"></script>
<script src="js/leagues/nfl.js?v=3"></script>
<script src="js/leagues/nhl.js?v=3"></script>
<script src="js/leagues/wnba.js?v=3"></script>
<script src="js/modes.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
