<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fan Fluent game tests</title>
<style>
  body{font:14px/1.5 system-ui,sans-serif;margin:16px;background:#fff;color:#111}
  .pass{color:#0a7a32} .fail{color:#b00020;font-weight:600}
  #summary{font-size:18px;font-weight:700;margin-bottom:8px}
  iframe{width:400px;height:300px;border:1px solid #ccc;max-width:100%}
</style>
</head>
<body>
<!-- Serve the project folder (e.g. python3 -m http.server) and open /tests/game-test.html.
     It loads the real app in an iframe and checks the game rules from CLAUDE.md. -->
<div id="summary">Running…</div>
<ol id="log"></ol>
<iframe id="app" src="../index.html#nfl"></iframe>
<script>
const results = [];
function check(name, ok, detail){
  results.push({name, ok, detail});
  const li = document.createElement("li");
  li.className = ok ? "pass" : "fail";
  li.textContent = (ok ? "✓ " : "✗ ") + name + (ok || !detail ? "" : " — " + detail);
  document.getElementById("log").appendChild(li);
}

document.getElementById("app").onload = async () => {
  const w = document.getElementById("app").contentWindow;
  const ev = s => w.eval(s); // top-level const/let in the app's scripts are reachable through eval
  try { run(w, ev); } catch(e){ check("test runner crashed", false, e.stack || String(e)); }
  try { await runHashChange(w, ev); } catch(e){ check("hash change", false, e.stack || String(e)); }
  try { await runWithoutStorage(); } catch(e){ check("app works with storage unavailable", false, e.stack || String(e)); }
  const failed = results.filter(r=>!r.ok).length;
  document.getElementById("summary").textContent = failed ? `${failed} of ${results.length} checks failed` : `All ${results.length} checks passed`;
  document.getElementById("summary").className = failed ? "fail" : "pass";
  window.TEST_RESULTS = {passed: results.length - failed, failed, failures: results.filter(r=>!r.ok)};
};

// Loads a second copy of the app where every localStorage access throws.
async function runWithoutStorage(){
  const html = await (await fetch("../index.html")).text();
  const breakStorage = `<base href="${new URL("../", location.href)}"><script>
    window.__errors = []; addEventListener("error", e => __errors.push(e.message));
    Object.defineProperty(window, "localStorage", {get(){ throw new Error("storage blocked"); }});<\/script>`;
  const f = document.createElement("iframe");
  f.srcdoc = html.replace("<head>", "<head>" + breakStorage);
  await new Promise(r => { f.onload = r; document.body.appendChild(f); });
  const w = f.contentWindow, ev = s => w.eval(s);
  let blocked = false; try { w.localStorage; } catch(e){ blocked = true; }
  check("Storage really is blocked in the no-storage copy", blocked);
  ev("start")(ev("MODES")[0]);
  for(let i=0;i<10;i++){ ev("chooseMC")(0); ev("next")(); }
  const ok = !w.__errors.length && !w.document.getElementById("results").classList.contains("hidden");
  check("App still works with localStorage unavailable (full round, no errors)", ok, w.__errors.join("; "));
  f.remove();
}

function run(w, ev){
  const MODES = ev("MODES");
  let TEAMS = ev("TEAMS");
  const $ = id => w.document.getElementById(id);
  const colorKey = t => t.colors.map(c=>c.name).sort().join("|");
  const full = t => t.loc ? `${t.loc} ${t.name}` : t.name;
  const canPlay = (t, m) => m.group==="c" ? !!t.colors : !!t.loc;
  const team = name => TEAMS.find(t=>t.name===name);
  const mode = id => MODES.find(m=>m.id===id);
  const LEAGUES_SURFACE = Object.fromEntries(Object.values(w.LEAGUES).map(L=>[L.id, L.surface]));

  // --- multiple choice: every team, every MC mode, many shuffles (run for each league below) ---
  function mcChecks(league){
  for(const m of MODES.filter(m=>m.type==="mc")){
    const problems = [];
    const playable = TEAMS.filter(t=>canPlay(t, m));
    for(const t of playable){
      for(let r=0;r<15;r++){
        ev("start")(m, [t]);
        const opts = ev("S").opts;
        const correct = opts.filter(o=>ev("isCorrectMC")(o));
        if(opts.some(o=>!canPlay(o, m))) problems.push(`${full(t)}: shows a team that can't play this mode (${opts.map(full).join(", ")})`);
        if(opts.length!==4) problems.push(`${full(t)}: ${opts.length} choices`);
        if(correct.length!==1) problems.push(`${full(t)}: ${correct.length} correct choices`);
        if(new Set(opts.map(o=>o.loc)).size!==4) problems.push(`${full(t)}: two choices share a location (${opts.map(full).join(", ")})`);
        if(m.group==="c" && new Set(opts.map(colorKey)).size!==4) problems.push(`${full(t)}: two choices have the same color names (${opts.map(full).join(", ")})`);
        const sameDivAvail = playable.filter(o=>o!==t && o.div===t.div && o.loc!==t.loc && (m.group!=="c" || colorKey(o)!==colorKey(t))).length;
        const sameDivUsed = opts.filter(o=>o!==t && o.div===t.div).length;
        if(sameDivUsed < Math.min(3, sameDivAvail)) problems.push(`${full(t)}: didn't prefer same-division wrong answers`);
      }
    }
    check(`${league} MC "${m.title}" (${m.id}): 4 choices, 1 correct, no shared locations${m.group==="c"?", no identical color sets":""}, same division first`, !problems.length, [...new Set(problems)].slice(0,5).join("; "));
  }
  }
  mcChecks("NFL");

  // --- prompts are worded "Complete the team name" ---
  ev("start")(mode("c2n-mc"), [team("Panthers")]);
  check('City → Team prompt reads "Carolina ____" with "Complete the team name"', $("prompt").textContent.trim()==="Carolina ____" && $("prompt-label").textContent==="Complete the team name");
  ev("start")(mode("n2c-mc"), [team("Panthers")]);
  check('Team → City prompt reads "____ Panthers"', $("prompt").textContent.trim()==="____ Panthers" && $("prompt-label").textContent==="Complete the team name");

  // --- typed answers ---
  function typed(modeId, teamName, input){
    ev("start")(mode(modeId), [team(teamName)]);
    $("typed").value = input;
    ev("checkTyped")();
    return ev("S").score === 1;
  }
  const nameCases = [
    ["Packers","Packers",true], ["Packers","green bay packers",true], ["Packers","  Green   Bay  PACKERS ",true],
    ["Packers","Pack",false], ["Packers","Packer",false], ["Packers","Packers.",false], ["Packers","Pakers",false],
    ["49ers","49ers",true], ["49ers","San Francisco 49ers",true], ["49ers","Niners",false],
    ["Buccaneers","Bucs",false], ["Buccaneers","Tampa Bay Buccaneers",true],
    ["Giants","Jets",true], ["Giants","New York Jets",true], ["Rams","Chargers",true], ["Jets","Giants",true],
    ["Bills","Dolphins",false],
  ];
  const bad = nameCases.filter(([t,inp,exp])=>typed("c2n-tx",t,inp)!==exp);
  check(`Typed team names (${nameCases.length} cases: exact spelling, either shared-location team, no nicknames)`, !bad.length, bad.map(([t,i,e])=>`${t} ← "${i}" should be ${e?"accepted":"rejected"}`).join("; "));

  const locCases = [
    ["Packers","Green Bay",true], ["Packers","green  bay",true], ["Packers","Greenbay",false], ["Packers","GB",false],
    ["Rams","LA",true], ["Rams","L.A.",true], ["Chargers","Los Angeles",true],
    ["Giants","NY",true], ["Jets","NYC",true], ["Jets","N.Y.",true],
    ["Chiefs","KC",true], ["49ers","SF",true], ["Commanders","DC",true], ["Commanders","Washington DC",true], ["Commanders","Washington, D.C.",true],
    ["Eagles","Philly",false], ["Raiders","Vegas",false], ["Colts","Indy",false], ["Buccaneers","Tampa",false],
    ["Panthers","Charlotte",false], ["Patriots","Boston",false], ["Panthers","Carolina",true],
  ];
  const badLoc = locCases.filter(([t,inp,exp])=>typed("n2c-tx",t,inp)!==exp);
  check(`Typed locations (${locCases.length} cases: only LA/NY/NYC/KC/SF/DC short forms)`, !badLoc.length, badLoc.map(([t,i,e])=>`${t} ← "${i}" should be ${e?"accepted":"rejected"}`).join("; "));

  // --- IDK: typing modes only, counts as a miss, resets streak, no shake ---
  ev("start")(mode("c2n-mc"), [team("Bills")]);
  check("IDK hidden in multiple choice", $("idk").classList.contains("hidden"));
  ev("start")(mode("c2n-tx"), TEAMS.slice(0,3));
  $("typed").value = "Bills"; ev("checkTyped")(); ev("next")();
  $("typed").value = "Dolphins"; ev("checkTyped")(); ev("next")();
  const streakBefore = ev("S").streak;
  $("qcard").classList.remove("shake");
  $("idk").click();
  const S = ev("S");
  check("IDK: visible in typing mode, counts as a miss, resets streak, no shake", streakBefore===2 && S.streak===0 && S.missed.length===1 && !$("qcard").classList.contains("shake") && $("feedback").textContent.startsWith("No worries"));

  // --- round length and practice-missed replay ---
  w.document.getElementById("pool").value = "all";
  ev("start")(mode("t2col"));
  check("A round is 10 questions", ev("S").queue.length===10);
  const missedNames = [], missedOpts = [];
  for(let i=0;i<10;i++){
    const s = ev("S");
    const wrongIdx = s.opts.findIndex(o=>!ev("isCorrectMC")(o));
    const pick = i%3===0 ? wrongIdx : s.opts.findIndex(o=>ev("isCorrectMC")(o));
    if(i%3===0){ missedNames.push(s.current.name); missedOpts.push(s.opts.map(o=>o.name).join(",")); }
    ev("chooseMC")(pick); ev("next")();
  }
  check(`Results: "Practice missed (${missedNames.length})" is the highlighted button`, $("retry-missed").textContent===`Practice missed (${missedNames.length})` && !$("retry-missed").classList.contains("ghost") && $("again").classList.contains("ghost"));
  $("retry-missed").click();
  const replayNames = [], replayOpts = [];
  for(let i=0;i<missedNames.length;i++){
    const s = ev("S"); replayNames.push(s.current.name); replayOpts.push(s.opts.map(o=>o.name).join(","));
    ev("chooseMC")(s.opts.findIndex(o=>ev("isCorrectMC")(o))); ev("next")();
  }
  check(`Practice replays the exact missed questions in order with the same choices, titled "Practice · N missed teams"`, JSON.stringify(replayNames)===JSON.stringify(missedNames) && JSON.stringify(replayOpts)===JSON.stringify(missedOpts));
  check("Perfect practice round hides Practice missed", $("retry-missed").classList.contains("hidden"));

  // --- pools ---
  const pools = [...$("pool").options].map(o=>o.textContent);
  check("Pool options are All teams (32 teams), AFC (16 teams), NFC (16 teams)", JSON.stringify(pools)===JSON.stringify(["All teams (32 teams)","AFC (16 teams)","NFC (16 teams)"]), pools.join(" | "));
  $("pool").value = "AFC";
  ev("start")(mode("c2n-mc"));
  check("AFC pool only asks AFC teams", ev("S").queue.every(t=>t.conf==="AFC"));
  $("pool").value = "all";

  // --- footer ---
  check("Footer keeps disclaimer and source credits", /Not affiliated with or endorsed by the NFL or any of its teams\./.test($("credits").textContent) && /NFL\.com/.test($("credits").textContent) && /TeamColorCodes\.com/.test($("credits").textContent));

  // --- NBA (same rules, different data) ---
  ev("setLeague")("nba"); TEAMS = ev("TEAMS");
  check("Switching league updates pools, subtitle and footer",
    JSON.stringify([...$("pool").options].map(o=>o.textContent))===JSON.stringify(["All teams (30 teams)","East (15 teams)","West (15 teams)"])
    && $("league-sub").textContent.includes("Basketball") && /endorsed by the NBA/.test($("credits").textContent));
  mcChecks("NBA");
  const nbaCases = [
    ["c2n-tx","Lakers","Clippers",true], ["c2n-tx","Clippers","Los Angeles Lakers",true], ["c2n-tx","Knicks","Nets",false],
    ["c2n-tx","76ers","Sixers",false], ["c2n-tx","Trail Blazers","trail  blazers",true], ["c2n-tx","Trail Blazers","Blazers",false],
    ["n2c-tx","Warriors","Golden State",true], ["n2c-tx","Warriors","San Francisco",false], ["n2c-tx","Clippers","LA",true],
    ["n2c-tx","Thunder","OKC",true], ["n2c-tx","Thunder","Okla City",false], ["n2c-tx","Knicks","NYC",true], ["n2c-tx","Nets","NY",false], ["n2c-tx","Wizards","D.C.",true],
  ];
  const badNba = nbaCases.filter(([m,t,inp,exp])=>typed(m,t,inp)!==exp);
  check(`NBA typed answers (${nbaCases.length} cases)`, !badNba.length, badNba.map(([m,t,i,e])=>`${t} ← "${i}" should be ${e?"accepted":"rejected"}`).join("; "));
  // --- MLB and NHL ---
  for(const [lid, label, pools] of [["mlb","MLB",["All teams (30 teams)","AL (15 teams)","NL (15 teams)"]], ["nhl","NHL",["All teams (32 teams)","East (16 teams)","West (16 teams)"]]]){
    ev("setLeague")(lid); TEAMS = ev("TEAMS");
    check(`${label}: pools, subtitle, footer and surface`, JSON.stringify([...$("pool").options].map(o=>o.textContent))===JSON.stringify(pools)
      && new RegExp(`endorsed by ${label}|endorsed by the ${label}`).test($("credits").textContent) && w.document.documentElement.dataset.surface===LEAGUES_SURFACE[lid]);
    mcChecks(label);
  }
  ev("setLeague")("mlb"); TEAMS = ev("TEAMS");
  const inRounds = (modeId, name) => { for(let r=0;r<30;r++){ ev("start")(mode(modeId)); if(ev("S").queue.some(t=>t.name===name)) return true; } return false; };
  check("MLB: Athletics never asked in name/city modes, but do come up in colors modes", !inRounds("c2n-mc","Athletics") && !inRounds("n2c-tx","Athletics") && inRounds("t2col","Athletics"));
  const mlbCases = [
    ["c2n-tx","Yankees","Mets",true], ["c2n-tx","Cubs","White Sox",true], ["c2n-tx","Dodgers","Angels",true], ["c2n-tx","Red Sox","Sox",false],
    ["c2n-tx","Blue Jays","bluejays",false], ["c2n-tx","Diamondbacks","D-backs",false],
    ["n2c-tx","Cardinals","St Louis",true], ["n2c-tx","Cardinals","St. Louis",true], ["n2c-tx","Cardinals","Saint Louis",false],
    ["n2c-tx","Rangers","Texas",true], ["n2c-tx","Rangers","Arlington",false], ["n2c-tx","Royals","KC",true], ["n2c-tx","Nationals","DC",true],
  ];
  const badMlb = mlbCases.filter(([m,t,inp,exp])=>typed(m,t,inp)!==exp);
  check(`MLB typed answers (${mlbCases.length} cases)`, !badMlb.length, badMlb.map(([m,t,i,e])=>`${t} ← "${i}" should be ${e?"accepted":"rejected"}`).join("; "));

  ev("setLeague")("nhl"); TEAMS = ev("TEAMS");
  check("NHL: Mammoth never asked in colors modes, but do come up in name/city modes", !inRounds("t2col","Mammoth") && !inRounds("col2t","Mammoth") && inRounds("c2n-mc","Mammoth"));
  const nhlCases = [
    ["n2c-tx","Canadiens","Montréal",true], ["n2c-tx","Canadiens","montreal",true], ["n2c-tx","Golden Knights","Vegas",true], ["n2c-tx","Golden Knights","Las Vegas",false],
    ["n2c-tx","Blues","St. Louis",true], ["n2c-tx","Mammoth","Utah",true], ["n2c-tx","Kings","LA",true], ["n2c-tx","Ducks","LA",false],
    ["c2n-tx","Rangers","Islanders",true], ["c2n-tx","Maple Leafs","Leafs",false], ["c2n-tx","Golden Knights","golden knights",true], ["c2n-tx","Canadiens","Habs",false],
  ];
  const badNhl = nhlCases.filter(([m,t,inp,exp])=>typed(m,t,inp)!==exp);
  check(`NHL typed answers (${nhlCases.length} cases, accents optional)`, !badNhl.length, badNhl.map(([m,t,i,e])=>`${t} ← "${i}" should be ${e?"accepted":"rejected"}`).join("; "));
  ev("setLeague")("nba"); TEAMS = ev("TEAMS");

  typed("c2n-tx","Lakers","Bulls");
  check("NBA: court surface, and no 🚩 on a wrong answer", w.document.documentElement.dataset.surface==="court" && $("feedback").textContent.startsWith("Not quite."), $("feedback").textContent);
  ev("setLeague")("nfl"); TEAMS = ev("TEAMS");
  typed("c2n-tx","Bills","Jets");
  check("NFL: field surface, and 🚩 on a wrong answer", w.document.documentElement.dataset.surface==="field" && $("feedback").textContent.startsWith("🚩 Not quite."), $("feedback").textContent);

  ev("goHome")();
}

// Editing the #league part of the address switches league without a reload.
async function runHashChange(w, ev){
  w.location.hash = "nba";
  await new Promise(r => setTimeout(r, 50));
  const toNba = ev("LEAGUE").id==="nba" && !w.document.getElementById("home").classList.contains("hidden");
  w.location.hash = "nfl";
  await new Promise(r => setTimeout(r, 50));
  check("Changing #nba / #nfl in the address switches league", toNba && ev("LEAGUE").id==="nfl");
}
</script>
</body>
</html>
