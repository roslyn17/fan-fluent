<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fan Fluent logo</title>
<!-- Source for brand/logo.png (1600x680, same layout as the Pep Squad card image).
     Render: headless Chrome at --window-size=1600,680, then screenshot. -->
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Inter:wght@800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;background:#1f1b16}
  svg{display:block}
  .word{font-family:"Bricolage Grotesque",Inter,sans-serif;font-weight:800;font-size:118px;letter-spacing:-1px;font-optical-sizing:none;font-variation-settings:"opsz" 14}
  .bubble{font-family:Inter,sans-serif;font-weight:800;font-size:30px;letter-spacing:.5px}
</style>
</head>
<body>
<svg width="1600" height="680" viewBox="0 0 1600 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="680" fill="#1f1b16"/>

  <!-- team-color chips (in place of sparkles) -->
  <rect x="468" y="238" width="22" height="22" rx="5" fill="#c8102e" transform="rotate(-14 479 249)"/>
  <rect x="508" y="212" width="14" height="14" rx="3" fill="#ffcf3f" transform="rotate(10 515 219)"/>
  <rect x="1110" y="252" width="22" height="22" rx="5" fill="#2c63c4" transform="rotate(12 1121 263)"/>
  <rect x="1150" y="236" width="14" height="14" rx="3" fill="#3fa96b" transform="rotate(-8 1157 243)"/>

  <!-- left: hockey puck -->
  <g>
    <circle cx="537" cy="350" r="80" fill="#dfeaf2" stroke="#f6efe2" stroke-width="8"/>
    <ellipse cx="537" cy="370" rx="46" ry="16" fill="#111"/>
    <rect x="491" y="346" width="92" height="24" fill="#111"/>
    <ellipse cx="537" cy="346" rx="46" ry="16" fill="#2e2e2e"/>
    <ellipse cx="524" cy="342" rx="14" ry="4" fill="#4a4a4a"/>
      </g>

  <!-- right: baseball -->
  <g>
    <circle cx="1063" cy="350" r="80" fill="#ebe0f2" stroke="#f6efe2" stroke-width="8"/>
    <circle cx="1063" cy="350" r="50" fill="#fbf7ef" stroke="#e2d9c8" stroke-width="2"/>
    <g fill="none" stroke="#d12f3c" stroke-width="3.5" stroke-linecap="round">
      <path d="M1035 309 C1050 330 1050 370 1035 391"/>
      <path d="M1091 309 C1076 330 1076 370 1091 391"/>
      <path d="M1037 318 l9 -3 M1041 330 l9 -2 M1043 343 l9 -1 M1043 357 l9 1 M1041 370 l9 2 M1037 382 l9 3"/>
      <path d="M1089 318 l-9 -3 M1085 330 l-9 -2 M1083 343 l-9 -1 M1083 357 l-9 1 M1085 370 l-9 2 M1089 382 l-9 3"/>
    </g>
  </g>

  <!-- center left: basketball -->
  <g>
    <circle cx="707" cy="322" r="106" fill="#fbe3d3" stroke="#f6efe2" stroke-width="8"/>
    <circle cx="707" cy="322" r="68" fill="#e8792f"/>
    <g fill="none" stroke="#2a1a10" stroke-width="5" stroke-linecap="round">
      <path d="M639 322 H775"/>
      <path d="M707 254 V390"/>
      <path d="M659 274 C686 298 686 346 659 370"/>
      <path d="M755 274 C728 298 728 346 755 370"/>
    </g>
  </g>

  <!-- center right: football (on top) -->
  <g>
    <circle cx="893" cy="322" r="106" fill="#d9ead3" stroke="#f6efe2" stroke-width="8"/>
    <g transform="rotate(-35 893 322)">
      <ellipse cx="893" cy="322" rx="76" ry="44" fill="#8a4b2a"/>
      <path d="M836 300 Q840 322 836 344 M950 300 Q946 322 950 344" stroke="#fbf7ef" stroke-width="6" fill="none" stroke-linecap="round"/>
      <path d="M866 322 H920" stroke="#fbf7ef" stroke-width="5" stroke-linecap="round"/>
      <path d="M872 314 v16 M883 314 v16 M894 314 v16 M905 314 v16 M916 314 v16" stroke="#fbf7ef" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- speech bubble -->
  <g>
    <path d="M948 186 L938 222 L986 196 Z" fill="#c2410c"/>
    <rect x="930" y="122" width="210" height="76" rx="38" fill="#c2410c"/>
    <text x="1035" y="171" text-anchor="middle" class="bubble" fill="#fbf7ef">GO TEAM!</text>
  </g>

  <!-- wordmark -->
  <text x="800" y="560" text-anchor="middle" class="word"><tspan fill="#ffcf3f">fan</tspan><tspan fill="#f6efe2" dx="26">fluent</tspan></text>
</svg>
</body>
</html>
