<!doctype html><html><head><meta charset="utf-8">
<title>Fan Fluent logo</title>
<!-- Source for brand/logo.png (1600x680). Re-render: headless Chrome, --window-size=1600,680, then screenshot. -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@600;800&display=block" rel="stylesheet">
<style>html,body{margin:0}svg{display:block}.bebas{font-family:"Bebas Neue",Impact,sans-serif}.inter{font-family:Inter,sans-serif}</style>
</head><body><svg width="1600" height="680" viewBox="0 0 1600 680" xmlns="http://www.w3.org/2000/svg">
<defs>

 <radialGradient id="flood" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffbe0" stop-opacity=".55"/><stop offset="1" stop-color="#fffbe0" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>

<rect width="1600" height="680" fill="url(#turf)"/>
<g stroke="rgba(255,255,255,.12)" stroke-width="3"><path d="M0 120 H1600 M0 280 H1600 M0 440 H1600 M0 600 H1600"/></g>
<ellipse cx="260" cy="-20" rx="420" ry="190" fill="url(#flood)"/><ellipse cx="1340" cy="-20" rx="420" ry="190" fill="url(#flood)"/>
<rect x="360" y="175" width="880" height="330" rx="22" fill="url(#led)" stroke="#2b2f2d" stroke-width="8"/>
<text x="800" y="389" text-anchor="middle" class="bebas" font-size="188" letter-spacing="6" fill="#ffcf3f" filter="url(#glow)">FAN FLUENT</text>
<text x="800" y="461" text-anchor="middle" class="inter" font-weight="800" font-size="26" letter-spacing="7" fill="#8a8f8c">KNOW EVERY TEAM BY HEART.</text>
